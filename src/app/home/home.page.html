<ion-content>

  <div class="layout">

    <aside class="side-menu">

      <div class="menu-logo">
        TODO
      </div>

      <div class="menu-items">

        <ion-button
          fill="clear"
          class="menu-item active">
          <ion-icon name="home-outline"></ion-icon>
          <span>Home</span>
        </ion-button>

        <ion-button
          fill="clear"
          class="menu-item">
          <ion-icon name="checkmark-outline"></ion-icon>
          <span>Todo</span>
        </ion-button>

        <ion-button
          fill="clear"
          class="menu-item">
          <ion-icon name="settings-outline"></ion-icon>
          <span>Cài đặt</span>
        </ion-button>

      </div>

    </aside>


    <main class="main-content">

      <div class="page-header">

        <div>
          <h1>Việc Của Tôi</h1>
          <p>Quản Lý Công Việc</p>
        </div>

        <div class="search-group">

          <div class="search-section">
            <ion-searchbar
              placeholder="Tìm kiếm công việc"
              show-clear-button="focus"
              (ionInput)="onSearchInput($event)">
            </ion-searchbar>
          </div>

          <ion-button
            fill="clear"
            class="search-button"
            (click)="onSearch()">
            Tìm Kiếm
          </ion-button>

        </div>

      </div>


      <div class="filter-section">

        <ion-button
          [fill]="selectedFilter() === 'all' ? 'solid' : 'outline'"
          size="small"
          (click)="selectFilter('all')">
          Tất cả
        </ion-button>

        <ion-button
          [fill]="selectedFilter() === 'active' ? 'solid' : 'outline'"
          size="small"
          (click)="selectFilter('active')">
          Chưa hoàn thành
        </ion-button>

        <ion-button
          [fill]="selectedFilter() === 'completed' ? 'solid' : 'outline'"
          size="small"
          (click)="selectFilter('completed')">
          Hoàn thành
        </ion-button>

      </div>


      <div class="todo-section">

        <div class="section-title">
          <h2>Danh sách công việc</h2>
        </div>

        @if (filteredTodos().length === 0) {

          <div class="empty-state">
            <p>Ko có công việc nào</p>
          </div>

        }

        <app-todo-list
          [todos]="filteredTodos()">
        </app-todo-list>

      </div>


      <ion-fab
        vertical="bottom"
        horizontal="end"
        slot="fixed">

        <ion-fab-button routerLink="/todo/new">
          <ion-icon name="add"></ion-icon>
        </ion-fab-button>

      </ion-fab>

    </main>

  </div>

</ion-content>
